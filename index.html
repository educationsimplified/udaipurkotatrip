<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our 2022 Trip · Photo Album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf6ea;--ink:#3b2f24;--gold:#d9b46a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 40%,#74503a 0%,#33200f 65%,#1b0f07 100%);font-family:'Playfair Display',serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;user-select:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.stage{width:min(96vw,1000px,calc(80vh*1.4286));width:min(96vw,1000px,calc(80dvh*1.4286));perspective:2600px}
.book{position:relative;width:100%;aspect-ratio:10/7;transition:transform .9s ease;filter:drop-shadow(0 28px 36px rgba(0,0,0,.6))}
.book.start{transform:translateX(-25%)}.book.end{transform:translateX(25%)}
body.single .stage{width:min(94vw,520px,calc(78vh*.7143));width:min(94vw,520px,calc(78dvh*.7143))}
body.single .book{aspect-ratio:5/7;transform:none!important}
.leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.45,.05,.25,1)}
body.single .leaf{left:0;width:100%}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;container-type:size;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;padding:7cqh 7cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqh;
background:radial-gradient(rgba(120,90,50,.07) 1px,transparent 1.2px) 0 0/6px 6px,var(--paper)}
.front{border-radius:0 6px 6px 0;box-shadow:inset 6px 0 14px -6px rgba(0,0,0,.35)}
.back{transform:rotateY(180deg);border-radius:6px 0 0 6px;box-shadow:inset -6px 0 14px -6px rgba(0,0,0,.35)}
body.single .front,body.single .back{border-radius:6px}
.leather{background:linear-gradient(135deg,#5e3923,#37200f)!important;color:var(--gold);text-align:center;box-shadow:inset 0 0 40px rgba(0,0,0,.5)}
.leather::before{content:'';position:absolute;inset:4cqw;border:.6cqw dashed rgba(217,180,106,.55);border-radius:3px;pointer-events:none}
.leather.fr::after{content:'';position:absolute;top:0;right:11cqw;width:5.5cqw;height:24cqh;background:#8c1c1c;clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%)}
.cover h1{font-size:11cqw;margin:.15em 0;letter-spacing:.03em;line-height:1.05;background:linear-gradient(180deg,#f8e6a8,#c99a3d 60%,#f1d58a);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover p{font-family:Caveat;font-size:6cqw;margin:0;color:#e9cf8f}
.orn{font-size:7cqw;color:var(--gold)}
.grid{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:3cqh 4cqw;width:100%}
.photo{margin:0;position:relative;background:#fff;padding:2.2cqw 2.2cqw 1cqw;box-shadow:0 3px 12px rgba(0,0,0,.28);transform:rotate(var(--r,0deg));width:max-content;max-width:100%}
.photo::before{content:'';position:absolute;top:-2cqw;left:50%;width:12cqw;height:3.6cqw;background:rgba(217,180,106,.6);transform:translateX(-50%) rotate(-3deg);z-index:2}
.frame{position:relative;height:var(--h);aspect-ratio:9/16;overflow:hidden;background:#e8dfcc}
.frame::before{content:'';position:absolute;inset:-12%;background:var(--src) center/cover;filter:blur(14px) brightness(.92)}
.frame img{position:relative;width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.photo figcaption{font-family:Caveat;font-size:var(--fs,4cqw);text-align:center;padding-top:.8cqw;line-height:1.1;min-height:1em;max-width:100%}
.g1{--h:min(74cqh,150cqw);--fs:5.5cqw}.g2{--h:min(60cqh,66cqw);--fs:4.4cqw}.g3,.g4{--h:min(33cqh,70cqw);--fs:3.6cqw}
.vid video{width:76cqw;max-height:62cqh;background:#000;display:block;object-fit:contain}
.note{font-family:Caveat;font-size:5.6cqw;line-height:1.35;text-align:center;background:#fff8c9;padding:8cqw;box-shadow:0 4px 12px rgba(0,0,0,.2);transform:rotate(-1.5deg);white-space:pre-wrap;width:88%}
.chap{text-align:center}.chap small{letter-spacing:.3em;text-transform:uppercase;font-size:2.6cqw;opacity:.6}
.chap h2{font-size:12cqw;margin:.15em 0;font-style:italic}
.route{font-family:Caveat;font-size:5cqw;text-align:center;line-height:1.6}
.pn,.tag{position:absolute;bottom:3cqh;font-size:2.4cqw;opacity:.5}
.front .pn{right:7cqw}.back .pn{left:7cqw}
body.single .back .pn{left:auto;right:7cqw}
.nav{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;color:#e9d9b8;font-size:13px;padding:0 10px}
.nav button{background:rgba(255,255,255,.08);color:#e9d9b8;border:1px solid rgba(233,217,184,.4);border-radius:22px;padding:9px 16px;font:600 13px 'Playfair Display';cursor:pointer;backdrop-filter:blur(6px);transition:.2s}
.nav button:hover:not(:disabled){background:#e9d9b8;color:#3b2f24}
.nav button:disabled{opacity:.3;cursor:default}
#ct{min-width:92px;text-align:center}
#lb{position:fixed;inset:0;background:rgba(10,6,3,.96);z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;color:#f0e2c0}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:78vh;max-height:78dvh;object-fit:contain;box-shadow:0 10px 50px #000;border:8px solid #fff;background:#222;transition:opacity .25s}
#lbc{font-family:Caveat;font-size:26px;margin-top:14px;min-height:1.3em;text-align:center;padding:0 16px}
#lbn{font-size:13px;opacity:.7;margin-top:4px}
.lbb{position:absolute;background:rgba(255,255,255,.12);color:#f0e2c0;border:0;border-radius:50%;width:46px;height:46px;font-size:22px;cursor:pointer}
.lbb:hover{background:rgba(255,255,255,.25)}
#lbp{left:12px;top:50%}#lbx{right:12px;top:50%}#lbq{right:12px;top:12px}#lbf{right:66px;top:12px;font-size:18px}#lba{right:120px;top:12px;font-size:16px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#2c1b11;color:var(--gold);font:italic 22px 'Playfair Display';z-index:1100;transition:opacity .6s}
@media(max-width:520px){.nav button{padding:8px 12px;font-size:12px}}
</style></head><body>
<div id="load">Opening the album…</div>
<div id="lb"><button class="lbb" id="lbq" title="Close">✕</button><button class="lbb" id="lbf" title="Full screen">⛶</button><button class="lbb" id="lba" title="Autoplay">▶</button><button class="lbb" id="lbp">‹</button><button class="lbb" id="lbx">›</button><img id="lbi" alt=""><div id="lbc"></div><div id="lbn"></div></div>
<div class="stage"><div class="book start" id="book"></div></div>
<div class="nav"><button id="prev">◀ Back</button><span id="ct"></span><button id="next">Next ▶</button><button id="slide">🖼 Photo by photo</button><button id="fs">⛶ Full screen</button></div>
<script>


  const API='https://script.google.com/macros/s/AKfycbxWBHxyWHOm8fFHqgo13QxEEYGSEGmPBvX5al0lSPrD0PWOeLBns0jbRXH9FiYwVO-4/exec';
const PLACES=['Kota','Ajmer','Udaipur','Delhi'];
const TITLE='Our 2022 Trip',SUB='Kota → Ajmer → Udaipur → Delhi',WITH='with Ambeya, Fufa & Fufu';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const thumb=(id,w=1400)=>`https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
const vid=u=>u.replace('/blob/','/raw/');
let cur=0,N=0,leaves=[],gallery=[],gi=0,timer=null,PAGES=[],single=null;
const pg=(inner,cls='')=>({inner,cls});

function buildPages(items){
  const P=[];gallery=[];
  P.push(pg(`<div class="cover"><div class="orn">❦</div><h1>${TITLE}</h1><p>${SUB}</p><div class="orn">❦</div><p>${WITH}</p></div>`,'leather fr'));
  P.push(pg(`<div class="chap"><small>The Journey</small><h2>2022</h2></div><div class="route">${PLACES.map((p,i)=>`${i+1}. ${p}`).join('<br>↓<br>')}</div><div class="route">with Ambeya, Fufa &amp; Fufu</div>`));
  PLACES.forEach((pl,ci)=>{
    const its=items.filter(i=>i.place===pl).sort((a,b)=>new Date(a.time)-new Date(b.time));
    if(!its.length)return;
    P.push(pg(`<div class="chap"><small>Chapter ${ci+1}</small><h2>${pl}</h2><div class="orn">❦</div></div>`));
    let buf=[];
    const flush=()=>{if(buf.length){P.push(pg(`<div class="grid g${buf.length}">${buf.map(photoHTML).join('')}</div>`));buf=[]}};
    its.forEach(it=>{
      if(it.type==='photo'){it.g=gallery.push(it)-1;buf.push(it);if(buf.length===4)flush()}
      else{flush();P.push(it.type==='video'
        ?pg(`<figure class="photo vid" style="--fs:5cqw"><video controls preload="metadata" playsinline src="${esc(vid(it.value))}"></video><figcaption>${esc(it.caption)||'Video'}</figcaption></figure>`)
        :pg(`<div class="note">${esc(it.value)}</div>${it.caption?`<div class="route">${esc(it.caption)}</div>`:''}`))}
    });flush();
  });
  if(!items.length)P.push(pg('<div class="chap"><h2>No memories yet</h2></div>'));
  P.push(pg(`<div class="chap"><div class="orn">❦</div><h2>The End</h2><small>Memories last forever</small></div>`));
  P.push(pg(`<div class="cover"><div class="orn">❦</div><p>${SUB}</p></div>`,'leather'));
  return P;
}
const photoHTML=(it,i)=>`<figure class="photo" style="--r:${[-1.2,1.4,1,-1.5][i%4]}deg"><div class="frame" style="--src:url('${esc(thumb(it.fileId))}')"><img class="im" data-g="${it.g}" loading="lazy" src="${esc(thumb(it.fileId))}" alt=""></div><figcaption>${esc(it.caption)}</figcaption></figure>`;

function render(){
  if(!PAGES.length)return;
  const P=PAGES.slice(),b=book;b.innerHTML='';leaves=[];
  const blank=pg('');
  const mk=(f,k,i,nf,nk)=>{const l=document.createElement('div');l.className='leaf';
    const lf=f.cls.includes('leather'),lk=k.cls.includes('leather');
    l.innerHTML=`<div class="face front ${f.cls}">${f.inner}${lf?'':`<span class="pn">${nf}</span>`}</div><div class="face back ${k.cls}">${k.inner}${lk||!k.inner?'':`<span class="pn">${nk}</span>`}</div>`;
    return l};
  if(single){N=P.length;P.forEach((p,i)=>{const l=mk(p,blank,i,i+1,0);
    l.onclick=e=>{if(e.target.closest('video'))return;if(e.target.matches('img.im')){openLB(+e.target.dataset.g);return}
      const r=b.getBoundingClientRect();(e.clientX-r.left)<r.width*.3?go(-1):go(1)};
    b.appendChild(l);leaves.push(l)});}
  else{const back=P.pop();if(P.length%2===0)P.push(blank);P.push(back);N=P.length/2;
    for(let i=0;i<N;i++){const l=mk(P[2*i],P[2*i+1],i,2*i+1,2*i+2);
      l.onclick=e=>{if(e.target.closest('video'))return;if(e.target.matches('img.im')){openLB(+e.target.dataset.g);return}i<cur?go(-1):go(1)};
      b.appendChild(l);leaves.push(l)}}
  cur=Math.min(cur,single?N-1:N);update();
}
function update(mv){
  const mx=single?N-1:N;
  leaves.forEach((l,i)=>{l.classList.toggle('flipped',i<cur);l.style.zIndex=i<cur?i:N-i});
  if(mv!=null)leaves[mv].style.zIndex=N+2;
  book.classList.toggle('start',cur===0);book.classList.toggle('end',!single&&cur===N);
  prev.disabled=cur===0;next.disabled=cur>=mx;
  ct.textContent=cur===0?'Cover':cur>=mx?'Back cover':single?`Page ${cur+1}`:`Pages ${2*cur}–${2*cur+1}`;
}
function go(d){
  const mx=single?N-1:N,n=cur+d;if(n<0||n>mx)return;
  const mv=d>0?cur:n;cur=n;update(mv);
  setTimeout(()=>{if(leaves[mv])leaves[mv].style.zIndex=mv<cur?mv:N-mv},550);
}
function layout(){
  const s=innerWidth<760||innerWidth<innerHeight*1.05;if(s===single)return;
  if(single!==null)cur=s?cur*2:Math.ceil(cur/2);
  single=s;document.body.classList.toggle('single',s);render();
}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(layout,200)});
prev.onclick=()=>go(-1);next.onclick=()=>go(1);
addEventListener('keydown',e=>{const o=lb.classList.contains('on');if(e.key==='ArrowRight')o?step(1):go(1);if(e.key==='ArrowLeft')o?step(-1):go(-1);if(e.key==='Escape'&&o)closeLB()});
let sx=null;addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){const o=lb.classList.contains('on');o?step(dx<0?1:-1):go(dx<0?1:-1)}sx=null});

function showLB(){const it=gallery[gi];if(!it)return;lbi.style.opacity=0;lbi.onload=()=>lbi.style.opacity=1;lbi.src=thumb(it.fileId,2000);lbc.textContent=it.caption||'';lbn.textContent=`${it.place} · ${gi+1} / ${gallery.length}`}
function openLB(i){if(!gallery.length)return;gi=i||0;lb.classList.add('on');showLB()}
function closeLB(){lb.classList.remove('on');stopAuto()}
function step(d){if(!gallery.length)return;gi=(gi+d+gallery.length)%gallery.length;showLB()}
function stopAuto(){clearInterval(timer);timer=null;lba.textContent='▶'}
lba.onclick=()=>{if(timer)return stopAuto();lba.textContent='⏸';timer=setInterval(()=>step(1),3000)};
lbp.onclick=()=>step(-1);lbx.onclick=()=>step(1);lbq.onclick=closeLB;
lb.onclick=e=>{if(e.target===lb)closeLB()};slide.onclick=()=>openLB(0);
function toggleFS(){const d=document;if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else{const e=d.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}}
fs.onclick=lbf.onclick=toggleFS;
if(!(document.fullscreenEnabled||document.webkitFullscreenEnabled))fs.style.display=lbf.style.display='none';

fetch(API).then(r=>r.json()).then(d=>{PAGES=buildPages(d.items||[])}).catch(()=>{PAGES=buildPages([])})
.finally(()=>{layout();const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),600)});
</script></body></html>
