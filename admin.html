<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Album Admin</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:#f4ecdc;color:#3b2f24;min-height:100vh;padding:24px}
.card{max-width:720px;margin:0 auto 20px;background:#fffdf7;border-radius:14px;padding:24px;box-shadow:0 8px 28px rgba(60,40,20,.15)}
h1,h2{font-family:'Playfair Display',serif;margin:0 0 14px}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d8c9a8;border-radius:8px;font:inherit;background:#fff}
button{background:#4a2c1d;color:#f3dfae;border:0;border-radius:8px;padding:11px 20px;font:600 14px Inter;cursor:pointer;margin-top:16px}
button.sm{padding:6px 12px;margin:0;background:#a33;font-size:12px}
.tabs{display:flex;gap:8px}.tabs button{margin:0 0 14px;background:#e6d8b8;color:#4a2c1d}.tabs button.on{background:#4a2c1d;color:#f3dfae}
.drop{border:2px dashed #c9b27a;border-radius:12px;padding:28px;text-align:center;cursor:pointer;background:#fbf6ea}
.prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:12px}
.prev img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
.bar{height:8px;background:#eadfc6;border-radius:6px;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#4a2c1d;transition:width .3s}
#msg{margin-top:10px;font-size:14px}.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eee3cc;font-size:13px}
.row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hide{display:none}
</style></head><body>
<div class="card" id="login"><h1>Album Admin</h1>
<label>Password <small style="font-weight:400">(hint: your phone number)</small></label>
<input id="pw" type="password" placeholder="Enter password"><button onclick="login()">Enter</button><div id="lm"></div></div>

<div class="hide" id="panel">
<div class="card"><h1>Add to the Album</h1>
<div class="tabs"><button class="on" data-t="photo">📷 Photos</button><button data-t="video">🎬 Video</button><button data-t="note">📝 Note</button></div>
<label>Place</label><select id="place"><option>Kota</option><option>Ajmer</option><option>Udaipur</option><option>Delhi</option></select>
<div id="t-photo"><label>Photos (select many at once)</label>
<div class="drop" id="drop">Tap or drop images here<input id="files" type="file" accept="image/*" multiple hidden></div><div class="prev" id="pv"></div></div>
<div id="t-video" class="hide"><label>GitHub video link (.mp4)</label><input id="vurl" placeholder="https://github.com/user/repo/raw/main/video.mp4"></div>
<div id="t-note" class="hide"><label>Note</label><textarea id="ntext" rows="5" placeholder="Write a memory…"></textarea></div>
<label>Caption <small style="font-weight:400">(photos: applied to all selected)</small></label><input id="cap" placeholder="Optional caption">
<button onclick="submitIt()">Upload</button><div class="bar"><i id="bar"></i></div><div id="msg"></div></div>
<div class="card"><h2>Manage</h2><div id="list">Loading…</div></div></div>

<script>
const API='https://script.google.com/macros/s/AKfycbxWBHxyWHOm8fFHqgo13QxEEYGSEGmPBvX5al0lSPrD0PWOeLBns0jbRXH9FiYwVO-4/exec';
let PW=sessionStorage.getItem('pw')||'',tab='photo',picked=[];
const $=id=>document.getElementById(id);
const post=o=>fetch(API,{method:'POST',body:JSON.stringify({password:PW,...o})}).then(r=>r.json());
async function login(){
  PW=$('pw').value;$('lm').textContent='Checking…';
  try{const r=await post({action:'check'});if(r.ok){sessionStorage.setItem('pw',PW);open_()}else $('lm').textContent='❌ '+r.error}catch(e){$('lm').textContent='Network error'}
}
function open_(){$('login').classList.add('hide');$('panel').classList.remove('hide');load()}
if(PW)post({action:'check'}).then(r=>r.ok&&open_());
$('pw').addEventListener('keydown',e=>e.key==='Enter'&&login());

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['photo','video','note'].forEach(t=>$('t-'+t).classList.toggle('hide',t!==tab));
});
$('drop').onclick=()=>$('files').click();
$('drop').ondragover=e=>e.preventDefault();
$('drop').ondrop=e=>{e.preventDefault();pick(e.dataTransfer.files)};
$('files').onchange=e=>pick(e.target.files);
function pick(fl){picked=[...fl].filter(f=>f.type.startsWith('image/'));
  $('pv').innerHTML='';picked.forEach(f=>{const i=new Image();i.src=URL.createObjectURL(f);$('pv').appendChild(i)});
  $('drop').firstChild.textContent=picked.length+' image(s) selected';}
function resize(file,max=1600){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85).split(',')[1]);URL.revokeObjectURL(img.src)};img.onerror=()=>rej(new Error('Cannot read '+file.name));img.src=URL.createObjectURL(file)})}

async function submitIt(){
  const place=$('place').value,caption=$('cap').value.trim(),m=$('msg');
  try{
    if(tab==='photo'){
      if(!picked.length)return m.textContent='Select images first';
      for(let i=0;i<picked.length;i++){
        m.textContent=`Uploading ${i+1} of ${picked.length}…`;
        const data=await resize(picked[i]);
        const r=await post({action:'upload',place,caption,data,mime:'image/jpeg',name:picked[i].name.replace(/\.\w+$/,'')+'.jpg'});
        if(!r.ok)throw new Error(r.error);
        $('bar').style.width=((i+1)/picked.length*100)+'%';
      }
      picked=[];$('pv').innerHTML='';$('drop').firstChild.textContent='Tap or drop images here';
    }else if(tab==='video'){
      const url=$('vurl').value.trim();if(!url)return m.textContent='Paste a video link';
      const r=await post({action:'video',place,caption,url});if(!r.ok)throw new Error(r.error);$('vurl').value='';
    }else{
      const text=$('ntext').value.trim();if(!text)return m.textContent='Write a note';
      const r=await post({action:'note',place,caption,text});if(!r.ok)throw new Error(r.error);$('ntext').value='';
    }
    m.textContent='✅ Added to the album!';$('cap').value='';load();
  }catch(e){m.textContent='❌ '+e.message}
}
async function load(){
  const d=await fetch(API).then(r=>r.json());
  $('list').innerHTML=d.items.length?d.items.map(i=>`<div class="row"><span>${i.place} · ${i.type} · ${(i.caption||i.value||'').toString().slice(0,50)}</span><button class="sm" onclick="del('${i.id}')">Delete</button></div>`).join(''):'Nothing yet.';
}
async function del(id){if(!confirm('Delete this item?'))return;const r=await post({action:'delete',id});r.ok?load():alert(r.error)}
</script></body></html>
